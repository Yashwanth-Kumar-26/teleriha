name: Telegram Commit Notification

on:
  push:
    branches:
      - '**' # Trigger on push to any branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Telegram
        run: |
          # Define message payload
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          
          # Construct HTML formatted message (no emojis)
          MESSAGE="New Commit Pushed to $REPO
          
          Branch: $BRANCH
          Author: $AUTHOR
          Message: $COMMIT_MSG
          
          View commit on GitHub: $COMMIT_URL"
          
          # Send via curl to the Telegram Bot API
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_TO }}" \
            -d text="$MESSAGE"
